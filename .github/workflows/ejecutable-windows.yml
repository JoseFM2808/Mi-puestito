name: Ejecutable Windows

# Construye MiPuestito.exe. Se puede lanzar a mano desde la pestaña Actions
# ("Run workflow") o publicando una etiqueta v* — en ese caso el .exe queda
# adjunto a la Release para que cualquiera lo descargue.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  construir:
    runs-on: windows-latest
    # Necesario para adjuntar el .exe a la Release: el token por defecto es
    # de solo lectura y la publicación fallaría con 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construir la interfaz
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-empaquetado.txt

      - name: Empaquetar el ejecutable
        working-directory: backend
        run: pyinstaller MiPuestito.spec --noconfirm

      - name: Comprobar que el ejecutable arranca y responde
        working-directory: backend
        shell: pwsh
        run: |
          $proceso = Start-Process -FilePath dist\MiPuestito.exe -PassThru
          try {
            $listo = $false
            foreach ($intento in 1..30) {
              Start-Sleep -Seconds 2
              # El puerto es dinámico y lo escucha un proceso HIJO del
              # ejecutable de un solo archivo (no $proceso.Id): se lee el
              # puerto que la app recuerda en su carpeta de datos
              $archivoPuerto = Join-Path $env:LOCALAPPDATA 'MiPuestito\puerto.txt'
              if (Test-Path $archivoPuerto) {
                $puerto = (Get-Content $archivoPuerto).Trim()
                try { $respuesta = Invoke-RestMethod "http://127.0.0.1:$puerto/api/salud" -TimeoutSec 2 } catch { continue }
                # "ok" también se responde con módulos caídos: se exige que
                # ninguno haya quedado degradado dentro del ejecutable
                if ($respuesta.estado -eq 'ok') {
                  if ($respuesta.modulos_degradados.Count -gt 0) {
                    throw "Módulos degradados en el ejecutable: $($respuesta.modulos_degradados -join ', ')"
                  }
                  $listo = $true; break
                }
              }
            }
            if (-not $listo) { throw 'El ejecutable no respondió en /api/salud' }
            Write-Host 'El ejecutable arranca y responde correctamente'
          } finally {
            Get-CimInstance Win32_Process -Filter "Name='MiPuestito.exe'" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MiPuestito-windows
          path: backend/dist/MiPuestito.exe

      - name: Adjuntar a la Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/MiPuestito.exe
