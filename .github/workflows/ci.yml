name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Linters (Fase 2): TypeScript estricto sin `any`, hooks y formato
      - run: npm run lint
      - run: npm run formato:revisar
      - run: npm run build
      - run: npm run test

  backend:
    # Windows además de Linux: el ejecutable corre en Windows, y fallos como
    # la falta de tzdata solo aparecen ahí (Linux trae la base de zonas)
    strategy:
      # Un fallo en un sistema no debe ocultar el resultado del otro
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest
