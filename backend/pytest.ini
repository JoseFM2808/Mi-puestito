[pytest]
testpaths = tests
# Para que `pytest` a secas (AGENTS.md, CI) encuentre rutas.py, main.py, etc.
pythonpath = .
filterwarnings =
    # Un aviso de SQLAlchemy suele ser un bug silencioso (caché, tipos): falla el test
    error::sqlalchemy.exc.SAWarning
    # D-10: Starlette depreca httpx en su TestClient; se resuelve al migrar de cliente
    ignore:Using `httpx` with `starlette.testclient` is deprecated
