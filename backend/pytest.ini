[pytest]
testpaths = tests
# Para que `pytest` a secas (AGENTS.md, CI) encuentre rutas.py, main.py, etc.
pythonpath = .
filterwarnings =
    # Un aviso de SQLAlchemy suele ser un bug silencioso (caché, tipos): falla el test
    error::sqlalchemy.exc.SAWarning
    # D-10 resuelto: el TestClient de Starlette usa httpx2 (requirements.txt). Si vuelve a usar httpx, falla
    error:Using `httpx` with `starlette.testclient` is deprecated
